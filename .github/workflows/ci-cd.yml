name: Examen final CI CD
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: target/surefire-reports/

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Integration tests
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: target/failsafe-reports/

  acceptance-deploy-rollback:
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target
      - name: Acceptance, deployment and rollback
        run: bash deployment/deploy-demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs
          path: deployment/runtime/*.log
